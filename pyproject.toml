[project]
name = "surfcensus"
version = "0.0.1"
description = "Score, render and rate FreeSurfer surfaces around the occipital pole, for your own data or a census of public derivatives."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tomas Knapen" }]
dependencies = [
  "nibabel>=5",
  "numpy>=1.26",
  "scipy",
  "pandas>=2",
  "pyarrow",
  "matplotlib>=3.8",
  "imageio-ffmpeg",
  "pillow",
  "httpx",
  "typer",
  "pydantic>=2",
  "pydantic-settings",
  "pyyaml",
  "jaxtyping",
  "tqdm",
]

[project.optional-dependencies]
app = ["fastapi", "uvicorn[standard]", "sqlmodel", "jinja2"]
analysis = ["marimo", "statsmodels", "scikit-learn", "krippendorff"]
all = ["surfcensus[app,analysis]"]

[dependency-groups]
dev = ["pytest", "ruff", "pyrefly", "beartype", "hypothesis"]
# The browser test of the rater app (tests/test_browser.py, `just test-browser`). It drives a
# browser that is already installed: the executable named by SURFCENSUS_BROWSER, else Chrome.
browser = ["playwright"]

[project.scripts]
surfcensus = "surfcensus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surfcensus"]

# prototypes/ holds research scripts kept beside the package (its README says what they are).
# The wheel never had them; this keeps them out of the sdist as well.
[tool.hatch.build.targets.sdist]
exclude = ["/prototypes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not browser'"
markers = [
  "network: test needs internet access to public buckets",
  "browser: test drives the rater app in a real browser (needs the browser dependency group)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "RUF"]
# F722: jaxtyping shape strings such as Float[np.ndarray, "n 3"] are not forward references.
ignore = ["F722"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# Without this table pyrefly checks every Python file under the root with its "basic" preset.
# The table names that preset, so the package and the tests are checked as before, and leaves
# out prototypes/, whose scripts are run by path and import their siblings.
[tool.pyrefly]
preset = "basic"
project-excludes = ["prototypes"]
